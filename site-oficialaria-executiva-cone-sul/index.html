<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficialaria Executiva Cone Sul</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0e0e0e;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
            text-align: center;
        }
/* Isso inverte as cores do iframe, tornando o fundo branco em preto */
iframe {
    filter: invert(90%) hue-rotate(180deg) brightness(1.2);
}
        h1 {
            font-size: 2.2rem;
        }

        h1 span {
            color: #c4161c;
        }

        .line {
            width: 100%;
            height: 2px;
            background: #c4161c;
            margin: 20px 0 40px;
        }

        .hero img {
            max-width: 260px;
            width: 100%;
            margin-bottom: 40px;
        }

        /* 🔴 DUAS COLUNAS FIXAS */
        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .btn {
            background: #111;
            border: 2px solid #c4161c;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: #fff;
            transition: 0.3s;
        }

        .btn:hover {
            background: #c4161c;
            transform: scale(1.04);
        }

        .btn img {
            max-width: 110px;
            margin-bottom: 12px;
        }

        .btn span {
            display: block;
            font-size: 1.05rem;
            font-weight: bold;
        }

        footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #aaa;
        }

        /* Ajuste fino para telas muito pequenas */
        @media (max-width: 360px) {
            .btn span {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Oficialaria Executiva <span>Cone Sul</span></h1>
        <div class="line"></div>

        <div class="hero">
            <img src="imagem-principal.jpg" alt="Oficialaria Executiva">
        </div>

        <div class="buttons">

            <a class="btn" href="https://wa.me/5599999999999" target="_blank">
                <img src="ouvidoria.png" alt="Ouvidoria">
                <span>OUVIDORIA</span>
            </a>

            <a class="btn" href="https://wa.me/5599999999999" target="_blank">
                <img src="cornucopia.png" alt="Cornucópia">
                <span>CORNUCÓPIA</span>
            </a>

            <a class="btn" href="https://wa.me/5599999999999" target="_blank">
                <img src="medicina.png" alt="Medicina DeMolay">
                <span>MEDICINA DEMOLAY</span>
            </a>

            <a class="btn" href="https://wa.me/5599999999999" target="_blank">
                <img src="juridico.png" alt="Auxílio Jurídico">
                <span>AUXÍLIO JURÍDICO</span>
            </a>

        </div>

        <footer>
            © 2026 - Oficialaria Executiva Cone Sul
        </footer>

<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfNv6XA-eTay_9voIBm-RPUNKuS_kk3eu3CNw49sZJ9bfq1gQ/viewform?embedded=true" width="640" height="371" frameborder="0" marginheight="0" marginwidth="0">Carregando…</iframe>
    </div>

</body>
</html>
